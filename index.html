<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Traffic Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- vis-network CSS & JS -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Panel -->
        <aside class="sidebar">
            <div class="brand">
                <h1>Smart Traffic</h1>
                <p>Floyd-Warshall routing</p>
            </div>

            <div class="control-group">
                <h3>Route Planning</h3>
                <label for="source">Source Junction:</label>
                <select id="source"></select>

                <label for="destination">Destination Junction:</label>
                <select id="destination"></select>
                
                <button id="calculate-btn">Calculate Route</button>
            </div>

            <div class="control-group">
                <h3>Traffic Control</h3>
                <p class="help-text">Click on any road in the map to simulate traffic (increase travel time), then recalculate the route.</p>
                <button id="reset-btn" class="secondary">Reset Traffic</button>
            </div>

            <div class="results-panel">
                <h3>Optimal Path</h3>
                <div id="path-result">Select nodes to calculate.</div>
                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-label">Total Time (min)</span>
                        <span id="total-weight" class="stat-value">--</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Visualization Area -->
        <main class="map-container">
            <div id="network"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
