<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Traffic Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Panel -->
        <aside class="sidebar">
            <div class="brand">
                <h1>Smart Traffic</h1>
                <p>Floyd-Warshall routing</p>
            </div>

            <div class="control-group">
                <h3>Route Planning</h3>
                <label for="source">Source City:</label>
                <select id="source"></select>

                <label for="destination">Destination City:</label>
                <select id="destination"></select>
                
                <button id="calculate-btn">Calculate Route</button>
            </div>

            <div class="control-group">
                <h3>Traffic Control</h3>
                <p class="help-text">Click on any road line on the map to simulate a roadblock/traffic (increases km weight heavily), then recalculate the route.</p>
                <button id="reset-btn" class="secondary">Reset Traffic</button>
            </div>

            <div class="results-panel">
                <h3>Optimal Path</h3>
                <div id="path-result">Select cities to calculate.</div>
                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-label">Total Distance</span>
                        <span id="total-weight" class="stat-value">-- km</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Visualization Area -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
