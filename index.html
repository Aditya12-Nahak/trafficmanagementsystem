<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Traffic Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Panel -->
        <aside class="sidebar" style="overflow-y: auto;">
            <div class="brand">
                <h1>Smart Traffic Map</h1>
                <p>Interactive Geographic Selection</p>
            </div>

            <div class="results-panel" style="background: linear-gradient(145deg, #3b82f6, #2563eb); border-color: #60a5fa;">
                <h3>Current Action</h3>
                <div id="instruction-text" style="font-size: 16px; font-weight: 600; color: white;">
                    Step 1: Click a State on the map to select Origin.
                </div>
            </div>

            <div class="control-group">
                <h3>Origin</h3>
                <label for="source-state">State:</label>
                <select id="source-state" disabled></select>

                <label for="source">City:</label>
                <select id="source" disabled></select>
            </div>

            <div class="control-group">
                <h3>Destination</h3>
                <label for="dest-state">State:</label>
                <select id="dest-state" disabled></select>

                <label for="destination">City:</label>
                <select id="destination" disabled></select>
                
                <button id="calculate-btn" style="margin-top: 15px; opacity: 0.5; pointer-events: none;">Calculate Route</button>
            </div>

            <div class="control-group">
                <h3>Reset & Traffic</h3>
                <button id="restart-btn" class="secondary" style="margin-bottom: 10px;">Restart Selection</button>
                <p class="help-text">Click on any green road line after routing to simulate heavy traffic/roadblock.</p>
            </div>

            <div class="results-panel">
                <h3>Optimal Path</h3>
                <div id="path-result">Awaiting selection.</div>
                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-label">Total Distance</span>
                        <span id="total-weight" class="stat-value">-- km</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Visualization Area -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
